# Required whenever a project uses AndroidX dependencies (we do) — without this,
# AGP fails the build with "This project uses AndroidX dependencies, but the
# 'android.useAndroidX' property is not enabled".
android.useAndroidX=true

# Faster builds: only generate R classes each module actually needs.
android.nonTransitiveRClass=true

# Reasonable heap for the Gradle daemon on CI runners.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
